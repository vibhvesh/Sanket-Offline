app:
  host: 0.0.0.0
  port: 8080
audio:
  device: null
  sample_rate: 16000
  channels: 1
  vad_aggressiveness: 2
  vad_frame_ms: 20
  pre_roll_seconds: 1
  silence_end_seconds: 2
transcription:
  language: en
  model: /opt/sanket-offline/whisper.cpp/models/ggml-base.en.bin
  cli: /opt/sanket-offline/whisper.cpp/build/bin/whisper-cli
  threads: 4
storage:
  data_dir: /var/lib/sanket-offline
  retention_days: 30
keyword_rules:
  - phrase: "sample phrase"
    channel: 1
    action: ON
    enabled: false
